<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
  <title>Focus areas</title>
  <defs>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
  </defs>

  <!-- tile 1 (focused window) -->
  <rect x="1" y="1" width="442" height="138" rx="10" fill="#050505" stroke="url(#active)" stroke-width="2"/>
  <text x="22" y="30" font-weight="700" fill="#ffffff">[1] semiconductors</text>
  <text x="22" y="58" fill="#a8a8a8"><tspan fill="#525252">- </tspan>RTL to GDS flow</text>
  <text x="22" y="80" fill="#a8a8a8"><tspan fill="#525252">- </tspan>physical design</text>
  <text x="22" y="102" fill="#a8a8a8"><tspan fill="#525252">- </tspan>FinFET / SRAM process modelling</text>
  <text x="22" y="124" fill="#a8a8a8"><tspan fill="#525252">- </tspan>SKY130 open-source ecosystem</text>

  <!-- tile 2 -->
  <rect x="457" y="1" width="442" height="138" rx="10" fill="#050505" stroke="#262626" stroke-width="2"/>
  <text x="478" y="30" font-weight="700" fill="#cfcfcf">[2] embedded</text>
  <text x="478" y="58" fill="#a8a8a8"><tspan fill="#525252">- </tspan>bare-metal C on ARM Cortex-M</text>
  <text x="478" y="80" fill="#a8a8a8"><tspan fill="#525252">- </tspan>STM32 peripheral drivers</text>
  <text x="478" y="102" fill="#a8a8a8"><tspan fill="#525252">- </tspan>FreeRTOS, real-time scheduling</text>

  <!-- tile 3 -->
  <rect x="1" y="153" width="442" height="138" rx="10" fill="#050505" stroke="#262626" stroke-width="2"/>
  <text x="22" y="182" font-weight="700" fill="#cfcfcf">[3] fpga</text>
  <text x="22" y="210" fill="#a8a8a8"><tspan fill="#525252">- </tspan>Verilog / SystemVerilog</text>
  <text x="22" y="232" fill="#a8a8a8"><tspan fill="#525252">- </tspan>RISC-V</text>
  <text x="22" y="254" fill="#a8a8a8"><tspan fill="#525252">- </tspan>hardware acceleration</text>

  <!-- tile 4 -->
  <rect x="457" y="153" width="442" height="138" rx="10" fill="#050505" stroke="#262626" stroke-width="2"/>
  <text x="478" y="182" font-weight="700" fill="#cfcfcf">[4] co-design</text>
  <text x="478" y="210" fill="#a8a8a8"><tspan fill="#525252">- </tspan>hw/sw boundary as a design choice</text>
  <text x="478" y="232" fill="#a8a8a8"><tspan fill="#525252">- </tspan>low-latency systems</text>
</svg>
